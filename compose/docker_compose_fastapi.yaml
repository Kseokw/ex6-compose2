services:
  service-fastapi:
    image: seok9/myfastapi:v4
    build:
      context: ../build/fastapi # FastAPI Dockerfile이 있는 현재 경로
      dockerfile: Dockerfile
    container_name: my-app
    restart: unless-stopped
    environment:
      # 코드 내 DB_INFO["host"]를 'my-service-db'로 설정해야 합니다.
      DB_HOST: "my-db"
      DB_USER: "std07"
      DB_PASSWORD: "1234"
      DB_NAME: "testdb"
    ports:
      - "8000:8000"
    networks:
      - backend-net

networks:
  backend-net:
    driver: bridge
