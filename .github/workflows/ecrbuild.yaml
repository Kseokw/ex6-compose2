# 워크플로우(작업) 이름
name: GitOps compose2 CICD Pipeline

# 1. 트리거 설정: 브랜치 정의
on:
  push:
    branches:
      - main

jobs:
  build-and-update:
    runs-on: ubuntu-latest # 실제 작업 주체
    
    # 작업 절차
    steps:
    - name: 소스코드 전송
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{secrets.DOCKER_USER}}
        password: ${{secrets.DOCKER_PASSWORD}}
    


    - name: AWS 자격 증명 설정
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{secrets.AWS_ACCESS_KEY}}
        aws-secret-access-key: ${{secrets.AWS_SECRETS_ACCESS_KEY}}
        aws-region: ${{secrets.AWS_REGION}}

    - name: S3 정적웹사이트로 배포
      run: |
       aws s3 cp ./compose/docker_compose_nginx.yaml s3://std07-git-web-s3/web-compose/docker_compose_nginx.yaml
       aws s3 cp ./compose/docker_compose_fastapi.yaml s3://std07-git-web-s3/web-compose/docker_compose_fastapi.yaml
  
    # ECR에 DOCKER 이미지 빌드 및 푸시
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2 

    - name: Build and push Docker image to ECR
      env:
      #   ECR_REGISTRY: ${{}}
      #   ECR_REPOSITORY: ${{}}
      #   IMAGE_TAG: ${{github.sha}}
        accountid: ${{925047940866}}

      # ./nginx의 경로는 현재 깃허브저장소 안에서 찾는것
      run: |
        docker build --no-cache -t 925047940866.dkr.ecr.ap-southeast-1.amazonaws.com/std07/nginx2:latest ./build/nginx
        docker build --no-cache -t 925047940866.dkr.ecr.ap-southeast-1.amazonaws.com/std07/fastapi ./build/fastapi

        docker push 925047940866.dkr.ecr.ap-southeast-1.amazonaws.com/std07/nginx2:latest
        docker push 925047940866.dkr.ecr.ap-southeast-1.amazonaws.com/std07/fastapi:latest

# [AWS계정ID].dkr.ecr.[리전].amazonaws.com/[레포지토리이름]:[태그]
    - name: docker로 배포
      run: |
       aws ssm send-command \
        --document-name "AWS-RunShellScript" \
        --targets "Key=tag:Cicd,Values=asg" \
        --parameters "commands=[
          "mkdir -p /home/ec2-user/app",
          "cd /home/ec2-user/app",
          "aws ecr get-login-password --region ap-southeast-1 | docker login --username AWS --password-stdin 925047940866.dkr.ecr.ap-southeast-1.amazonaws.com",
          "aws s3 sync s3://std07-git-web-s3/web-compose .",
          "docker compose pull",
          "docker compose up -d --remove-orphans",
          "docker image prune -f"
        ]" \
        --region ${{secrets.AWS_REGION}} \
        --comment "Deploying SSM Docker"
      

    # \"docker compose up -d --remove-orphans\" 현재 compose 안에 정의된 모든 서비스를 실행하고 파일과 일치하지 않는 서비스는 삭제
    # \"dockre image prune -f\" 현재 사용되지 않는 이미지삭제
          #     \"docker compose up -d --remove-orphans\",
          # \"docker image prune -f\"
